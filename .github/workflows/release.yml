# Tag v<version> → draft GitHub release with the Windows installer, the macOS app/dmg and the
# signed updater feed (latest.json). Publish the draft to roll the update out to users.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-15
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Python environment and bundled Chromium
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r backend/requirements-lock.txt
          "$PY" -m pip install -e backend --no-deps
          # Windows freezes Chromium into the core; the macOS core downloads it on first run.
          if [ "$RUNNER_OS" = "Windows" ]; then
            PLAYWRIGHT_BROWSERS_PATH=0 "$PY" -m playwright install chromium --no-shell
          fi

      - run: npm ci

      - name: Checks
        shell: bash
        run: |
          "$PY" -m pytest backend/tests -q -p no:cacheprovider
          "$PY" -m ruff check backend
          npm run typecheck
          npm run lint
          npm test

      - name: Core sidecar (PyInstaller + smoke)
        shell: bash
        env:
          ALF_BUNDLED_OPENCODE_KEY: ${{ secrets.ALF_BUNDLED_OPENCODE_KEY }}
        run: |
          if [ -z "$ALF_BUNDLED_OPENCODE_KEY" ]; then
            echo "::error::Configure the ALF_BUNDLED_OPENCODE_KEY repository secret before releasing."
            exit 1
          fi
          "$PY" scripts/build-core.py

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Artist Lead Finder ${{ github.ref_name }}
          releaseBody: |
            Windows: ArtistLeadFinder_*_x64-setup.exe. Если SmartScreen предупреждает — «Подробнее» → «Выполнить в любом случае».
            Portable для Windows: распакуйте ArtistLeadFinder-Portable.zip и запустите artist-lead-finder.exe внутри папки.
            macOS (Apple Silicon): *.dmg → перетащите в «Программы». Сборка без подписи Apple: при первом запуске «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть», или в Терминале:
            xattr -dr com.apple.quarantine "/Applications/Artist Lead Finder.app"
            Установленные версии обновятся сами после публикации этого релиза.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.production.conf.json --features custom-protocol --bundles ${{ matrix.bundles }}

      - name: Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'ArtistLeadFinder-Portable'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/artist-lead-finder.exe' -Destination $portable
          Copy-Item -LiteralPath 'src-tauri/core/artist-core' -Destination (Join-Path $portable 'core') -Recurse
          $archive = Join-Path $env:RUNNER_TEMP 'ArtistLeadFinder-Portable.zip'
          Compress-Archive -LiteralPath $portable -DestinationPath $archive -CompressionLevel Optimal
          gh release upload '${{ github.ref_name }}' $archive --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Portable upload failed' }

      - name: Core inside the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find src-tauri/target -maxdepth 5 -path '*/bundle/macos/*.app' -type d | head -1)
          core="$app/Contents/Resources/core/artist-core"
          test -x "$core"
          codesign --verify --verbose "$core"
          # The bundled copy itself must answer: this is the path the app starts.
          "$PY" scripts/smoke-sidecar.py "$core"
