[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "artist-lead-finder-core"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "pydantic>=2.10,<3", "platformdirs>=4,<5", "playwright==1.57.0", "cryptography>=44,<47", "phonenumbers>=8.13,<10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["artist_lead_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The shared %TEMP%/pytest-of-<user> folder can be left unreadable by another
# sandbox or account; a local base keeps tests independent of it.
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
